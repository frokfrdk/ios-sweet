name: sweetgl

# Stage 7.0: Mesa freedreno (gallium, msm kmd) cross-built for iOS arm64 against
# sweetdrm, as static libraries. 7.2: sweetgl-tri links them into an offscreen
# clear-and-triangle test for the device. 7.3: libsweetgl.a, the surfaceless
# GLES frontend, and sweetgl-gltri, the same test through GL calls. 7.5: the
# EAGL shim (libsweeteagl) and sweetgl-eagltri, which drives it as CA does.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/sweetgl/**"
      - ".github/workflows/sweetgl.yml"

env:
  MESA_TAG: mesa-26.2.5
  MESA_COMMIT: ddaf85e353442d9d7f192fdcf1823e652e3f2ee3

jobs:
  build:
    # same Xcode / iPhoneOS SDK as xnu.yml
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install bison ninja
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install meson==1.5.2 mako==1.3.5 pyyaml==6.0.2 packaging==24.1
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Mesa source
        run: |
          git clone --depth 1 --branch "$MESA_TAG" https://gitlab.freedesktop.org/mesa/mesa.git "$RUNNER_TEMP/mesa"
          test "$(git -C "$RUNNER_TEMP/mesa" rev-parse HEAD)" = "$MESA_COMMIT"
          git -C "$RUNNER_TEMP/mesa" apply --verbose "$GITHUB_WORKSPACE"/tools/sweetgl/mesa/*.patch

      - name: sweetdrm
        run: |
          XC=/Applications/Xcode_16.4.app
          export DEVELOPER_DIR="$XC/Contents/Developer"
          cd tools/sweetgl/sweetdrm
          INC="-I$RUNNER_TEMP/mesa/include -Iinclude"
          # 7.1 host test against a fake SweetGPU
          clang -std=gnu11 -Wall -Wextra -fsanitize=address,undefined -g $INC sweetdrm.c sweetdrm_iokit.c \
            test/test_sweetdrm.c -framework IOKit -framework CoreFoundation -o "$RUNNER_TEMP/test_sweetdrm"
          "$RUNNER_TEMP/test_sweetdrm"
          # the library Mesa links on iOS
          mkdir -p "$GITHUB_WORKSPACE/out/lib"
          for f in sweetdrm sweetdrm_iokit; do
            xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -std=gnu11 -O2 -Wall -Wextra -Werror \
              $INC -c $f.c -o "$RUNNER_TEMP/$f.o"
          done
          xcrun ar rcs "$GITHUB_WORKSPACE/out/lib/libsweetdrm.a" "$RUNNER_TEMP"/sweetdrm*.o

      - name: Build
        run: |
          XC=/Applications/Xcode_16.4.app
          export DEVELOPER_DIR="$XC/Contents/Developer"
          xcodebuild -version
          meson --version; bison --version | head -1
          bash tools/sweetgl/mesa/build.sh "$RUNNER_TEMP/mesa" out

      - name: Check
        run: |
          mkdir -p out/lib
          find out/build -name '*.a' -exec cp {} out/lib/ \;
          ls -l out/lib
          nm -g out/lib/libfreedreno.a | grep -q ' T _fd_screen_create'
          nm -g out/lib/libfreedrenowinsys.a | grep -q ' T _fd_drm_screen_create_renderonly'
          # every libdrm symbol the driver needs, which 7.1 (sweetdrm) has to provide
          for a in out/lib/*.a; do nm -u "$a"; done | grep -E '^_drm' | sort -u | tee out/lib/drm-imports.txt
          nm -gU out/lib/libsweetdrm.a | awk '{print $3}' | grep -E '^_drm' | sort -u > out/lib/drm-exports.txt
          if comm -23 out/lib/drm-imports.txt out/lib/drm-exports.txt | grep .; then
            echo "libdrm calls sweetdrm lacks (above)"; exit 1
          fi
          (cd out/lib && shasum -a 256 *.a > SHA256SUMS)

      - name: sweetgl-tri
        run: |
          XC=/Applications/Xcode_16.4.app
          export DEVELOPER_DIR="$XC/Contents/Developer"
          mkdir -p out/bin
          bash tools/sweetgl/test/build-tri.sh "$RUNNER_TEMP/mesa" out/build out/lib out/bin/sweetgl-tri
          (cd out/bin && shasum -a 256 sweetgl-tri > SHA256SUMS)

      - name: sweetgl frontend and sweetgl-gltri
        run: |
          XC=/Applications/Xcode_16.4.app
          export DEVELOPER_DIR="$XC/Contents/Developer"
          bash tools/sweetgl/frontend/build.sh "$RUNNER_TEMP/mesa" out/build out/lib/libsweetgl.a
          # exported (not private extern) definitions, as the EAGL shim's dylib will need them;
          # Mach-O names, so C's _mesa_glapi_set_dispatch is __mesa_glapi_set_dispatch
          for c in libglapi.a:__mesa_glapi_set_dispatch libsweetgl.a:_sweetgl_context_create libsweetgl.a:_glClear; do
            lib=out/lib/${c%%:*} sym=${c#*:}
            if ! nm -gU "$lib" | grep -q " T $sym\$"; then
              echo "$sym is not an exported definition in $lib:"; nm -m "$lib" | grep -w "$sym" || true; exit 1
            fi
          done
          bash tools/sweetgl/test/build-gltri.sh "$RUNNER_TEMP/mesa" out/build out/lib out/bin/sweetgl-gltri

      - name: EAGL shim and sweetgl-eagltri
        run: |
          XC=/Applications/Xcode_16.4.app
          export DEVELOPER_DIR="$XC/Contents/Developer"
          bash tools/sweetgl/eagl/build.sh "$RUNNER_TEMP/mesa" out/lib out/bin
          # the dylib exports the installer only, and gets every gl* from Mesa inside it
          nm -gU out/bin/libsweeteagl.dylib | tee "$RUNNER_TEMP/eagl-exports.txt"
          test "$(awk '{print $3}' "$RUNNER_TEMP/eagl-exports.txt")" = _sweeteagl_install
          if nm -u out/bin/libsweeteagl.dylib | grep -E '^_gl[A-Z]'; then
            echo "gl* left undefined in the dylib (above)"; exit 1
          fi
          nm out/lib/libsweeteagl.a | grep -q ' t _sweeteagl_unknown_stubs\| T _sweeteagl_unknown_stubs'
          bash tools/sweetgl/test/build-eagltri.sh "$RUNNER_TEMP/mesa" out/lib out/bin/sweetgl-eagltri
          if nm -u out/bin/sweetgl-eagltri | grep -E '^_gl[A-Z]'; then
            echo "gl* left undefined in sweetgl-eagltri (above)"; exit 1
          fi
          (cd out/lib && shasum -a 256 *.a > SHA256SUMS)
          (cd out/bin && shasum -a 256 sweetgl-tri sweetgl-gltri sweetgl-eagltri libsweeteagl.dylib > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: sweetgl-mesa
          path: out/lib/

      - uses: actions/upload-artifact@v4
        with:
          name: sweetgl-tri
          path: out/bin/

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: meson-logs
          path: out/build/meson-logs/
